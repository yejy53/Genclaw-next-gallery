<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机甲英雄 · 部署选择</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#f4f1e9;
    --ivory-2:#fbf9f3;
    --ink:#2c2f36;
    --ink-soft:#6b6f78;
    --glass:rgba(255,255,255,.55);
    --glass-brd:rgba(255,255,255,.75);
    --accent:#17b7a6;      /* dynamic — set per hero */
    --accent-2:#0e8a7d;
    --shadow:0 18px 40px rgba(60,70,90,.16);
    --shadow-s:0 8px 20px rgba(60,70,90,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Rajdhani","Noto Sans SC",system-ui,sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:
      radial-gradient(1200px 700px at 20% 0%, #ffffff 0%, transparent 55%),
      radial-gradient(1000px 800px at 100% 100%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 55%),
      linear-gradient(160deg,#f6f3ec 0%, #ece7db 100%);
    transition:background .8s ease;
  }
  /* faint grid */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(color-mix(in srgb,var(--accent) 10%,transparent) 1px,transparent 1px),
      linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent) 1px,transparent 1px);
    background-size:46px 46px;
    mask:radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
    opacity:.5;transition:.8s;
  }
  .fx-title,.hud{font-family:"Orbitron",sans-serif}

  /* ===== top bar ===== */
  header{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 30px;
  }
  header .logo{font-family:"Orbitron";font-weight:900;letter-spacing:3px;font-size:1.3rem}
  header .logo span{color:var(--accent);transition:.5s}
  header .sys{font-family:"Orbitron";font-size:.72rem;letter-spacing:2px;color:var(--ink-soft)}
  header .sys b{color:var(--accent);transition:.5s}

  /* ===== stage layout ===== */
  .stage{position:fixed;inset:0;z-index:1}
  #scene{position:absolute;inset:0}
  #scene canvas{cursor:grab}
  #scene canvas:active{cursor:grabbing}

  .glass{
    background:var(--glass);
    backdrop-filter:blur(14px) saturate(1.2);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid var(--glass-brd);
    border-radius:22px;
    box-shadow:var(--shadow);
  }

  /* ---- LEFT: hero dossier ---- */
  .dossier{
    position:fixed;left:26px;top:50%;transform:translateY(-50%);
    width:330px;z-index:4;padding:22px 22px 24px;
    animation:slideL .5s ease;
  }
  @keyframes slideL{from{opacity:0;transform:translate(-24px,-50%)}to{opacity:1;transform:translateY(-50%)}}
  .role-tag{
    display:inline-flex;align-items:center;gap:7px;
    font-family:"Orbitron";font-size:.66rem;letter-spacing:2px;
    padding:6px 12px;border-radius:20px;color:#fff;background:var(--accent);
    transition:.5s;
  }
  .hero-name{font-family:"Orbitron";font-weight:900;font-size:2rem;margin:12px 0 2px;line-height:1}
  .hero-sub{color:var(--ink-soft);font-size:.9rem;margin-bottom:14px}
  .lvl{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .lvl .ring{
    width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    font-family:"Orbitron";font-weight:700;font-size:1.1rem;color:var(--accent);
    background:conic-gradient(var(--accent) var(--lvlpct,72%), #e4e0d4 0);
    -webkit-mask:none;position:relative;transition:.5s;
  }
  .lvl .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ivory-2)}
  .lvl .ring b{position:relative;z-index:1}
  .lvl small{color:var(--ink-soft);font-family:"Orbitron";font-size:.62rem;letter-spacing:1px;display:block}
  .lvl .lvltxt{font-weight:700;font-size:.95rem}

  .stat{margin-bottom:11px}
  .stat .row{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px;font-weight:600}
  .stat .row span:last-child{font-family:"Orbitron";color:var(--accent);transition:.5s}
  .bar{height:8px;border-radius:6px;background:#e6e2d6;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}

  /* ---- RIGHT: hero avatars ---- */
  .roster{
    position:fixed;right:26px;top:50%;transform:translateY(-50%);
    z-index:4;display:flex;flex-direction:column;gap:16px;
  }
  .ava{
    width:96px;height:96px;border-radius:20px;cursor:pointer;position:relative;
    display:grid;place-items:center;overflow:hidden;
    border:2px solid transparent;transition:.28s;
    background:var(--glass);backdrop-filter:blur(10px);
    box-shadow:var(--shadow-s);
  }
  .ava:hover{transform:translateX(-6px) scale(1.04)}
  .ava .emo{font-size:2.3rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
  .ava .nm{position:absolute;bottom:0;left:0;right:0;font-family:"Orbitron";
    font-size:.52rem;letter-spacing:1px;text-align:center;padding:3px 0;color:#fff;
    background:linear-gradient(0deg,rgba(0,0,0,.45),transparent)}
  .ava.active{border-color:var(--hc);box-shadow:0 0 0 4px color-mix(in srgb,var(--hc) 30%,transparent),var(--shadow)}
  .ava .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--hc) 40%,transparent),transparent 70%);opacity:0;transition:.3s}
  .ava.active .glow{opacity:1}

  /* ---- BOTTOM: skin picker ---- */
  .skins{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:4;display:flex;align-items:center;gap:16px;padding:12px 22px;
  }
  .skins .lab{font-family:"Orbitron";font-size:.66rem;letter-spacing:2px;color:var(--ink-soft)}
  .swatches{display:flex;gap:11px}
  .sw{width:34px;height:34px;border-radius:11px;cursor:pointer;position:relative;
    border:2px solid #fff;box-shadow:var(--shadow-s);transition:.2s}
  .sw:hover{transform:translateY(-4px)}
  .sw.active::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}

  /* ---- DEPLOY button ---- */
  .deploy{
    position:fixed;right:30px;bottom:30px;z-index:6;
    font-family:"Orbitron";font-weight:800;letter-spacing:3px;font-size:1rem;
    color:#fff;padding:18px 42px;border:none;border-radius:18px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent);
    transition:.2s;overflow:hidden;position:fixed;
  }
  .deploy:hover{transform:translateY(-3px) scale(1.03);filter:brightness(1.07)}
  .deploy:active{transform:translateY(0) scale(.99)}
  .deploy::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:sheen 3.2s infinite}
  @keyframes sheen{0%{left:-60%}55%,100%{left:130%}}

  .hud{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:3;
    font-family:"Orbitron";font-size:.62rem;letter-spacing:3px;color:var(--ink-soft);
    text-align:center}

  /* ---- MODAL ---- */
  .modal-wrap{position:fixed;inset:0;z-index:20;display:none;place-items:center;
    background:rgba(40,44,52,.35);backdrop-filter:blur(6px)}
  .modal-wrap.on{display:grid;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:min(420px,90vw);padding:34px 30px;text-align:center;position:relative;
    animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .big{font-family:"Orbitron";font-size:.7rem;letter-spacing:4px;color:var(--accent);margin-bottom:6px}
  .modal h2{font-family:"Orbitron";font-size:1.8rem;margin-bottom:4px}
  .modal .r{color:var(--ink-soft);margin-bottom:18px}
  .modal .emo{font-size:3.4rem;margin-bottom:8px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
  .modal .acts{display:flex;gap:12px;margin-top:22px}
  .modal button{flex:1;font-family:"Orbitron";font-weight:700;letter-spacing:2px;
    padding:14px;border-radius:14px;cursor:pointer;border:none;font-size:.85rem;transition:.2s}
  .modal .confirm{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .modal .cancel{background:#e8e4d8;color:var(--ink)}
  .modal button:hover{transform:translateY(-2px)}

  /* skills sit in dossier */
  .skills{margin-top:16px}
  .skills h4{font-family:"Orbitron";font-size:.64rem;letter-spacing:2px;color:var(--ink-soft);margin-bottom:9px}
  .skill{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:13px;
    background:rgba(255,255,255,.45);margin-bottom:8px;transition:.2s;cursor:default}
  .skill:hover{transform:translateX(3px);background:rgba(255,255,255,.7)}
  .skill .ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;
    font-size:1.2rem;background:color-mix(in srgb,var(--accent) 18%,#fff);color:var(--accent-2)}
  .skill .tx b{display:block;font-size:.9rem;font-weight:700}
  .skill .tx small{color:var(--ink-soft);font-size:.76rem;line-height:1.35}

  @media(max-width:1000px){
    .dossier{width:min(300px,72vw);transform:none;top:70px;left:14px}
    .dossier{animation:none}
    .roster{right:14px;gap:10px}
    .ava{width:70px;height:70px}
    .deploy{padding:14px 26px;font-size:.85rem;right:14px;bottom:80px}
    .skins{gap:10px;padding:10px 14px;bottom:14px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">MECH<span>::</span>FORGE</div>
  <div class="sys hud">SELECT UNIT · <b id="sysName">—</b></div>
</header>

<div class="hud">◄ DRAG TO ROTATE ►</div>

<div class="stage">
  <div id="scene"></div>
</div>

<!-- LEFT dossier -->
<aside class="dossier glass" id="dossier"></aside>

<!-- RIGHT roster -->
<div class="roster" id="roster"></div>

<!-- BOTTOM skin picker -->
<div class="skins glass">
  <div class="lab">SKIN</div>
  <div class="swatches" id="swatches"></div>
</div>

<!-- DEPLOY -->
<button class="deploy" id="deployBtn">DEPLOY ▸</button>

<!-- MODAL -->
<div class="modal-wrap" id="modalWrap">
  <div class="modal glass">
    <div class="emo" id="mEmo">🤖</div>
    <div class="big">DEPLOYMENT CONFIRMED</div>
    <h2 id="mName">—</h2>
    <div class="r" id="mRole">—</div>
    <div style="font-size:.9rem;color:var(--ink-soft)" id="mMsg"></div>
    <div class="acts">
      <button class="cancel" id="mCancel">CANCEL</button>
      <button class="confirm" id="mGo">LAUNCH ▸</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =========================================================
   DATA (data-driven heroes)
   ========================================================= */
const SKINS = [
  {id:'signal', name:'信号青', primary:0x17b7a6, css:'#17b7a6', dark:'#0e8a7d'},
  {id:'ember',  name:'炽焰橙', primary:0xff7a29, css:'#ff7a29', dark:'#d9550f'},
  {id:'solar',  name:'烈日黄', primary:0xf5b41a, css:'#f5b41a', dark:'#d0930a'},
  {id:'violet', name:'量子紫', primary:0x8a6cf0, css:'#8a6cf0', dark:'#5f42c9'},
  {id:'crimson',name:'战意红', primary:0xff5470, css:'#ff5470', dark:'#d62c4e'}
];

const HEROES = [
  {
    id:'striker', emoji:'⚔️', name:'VULCAN-X', codename:'突击型机甲',
    role:'ATTACK · 突击', roleZh:'火力压制', level:47, lvlpct:83,
    accent:0xff7a29, accentCss:'#ff7a29', accentDark:'#d9550f',
    build:'attack',
    stats:{'攻击力':94,'机动性':78,'防护':46,'能量':70},
    skills:[
      {ic:'💥', name:'湮灭炮击', desc:'蓄能后发射高能等离子束，对直线目标造成毁灭性伤害。'},
      {ic:'🚀', name:'突进冲刺', desc:'瞬间突进至目标位置，附带冲击波击退敌人。'},
      {ic:'🔥', name:'过载狂热', desc:'终极技：攻速与伤害大幅提升，持续 8 秒。'}
    ]
  },
  {
    id:'aegis', emoji:'🛡️', name:'TITAN- V', codename:'重装型机甲',
    role:'DEFENSE · 重装', roleZh:'前线壁垒', level:52, lvlpct:90,
    accent:0x17b7a6, accentCss:'#17b7a6', accentDark:'#0e8a7d',
    build:'defense',
    stats:{'攻击力':58,'机动性':40,'防护':98,'能量':66},
    skills:[
      {ic:'🧱', name:'力场护盾', desc:'展开半球形能量护盾，吸收范围内所有远程伤害。'},
      {ic:'⚓', name:'嘲讽壁垒', desc:'强制吸引周围敌人火力，同时提升自身减伤。'},
      {ic:'🌐', name:'不动要塞', desc:'终极技：化为固定炮台，护甲与反弹伤害翻倍。'}
    ]
  },
  {
    id:'lumen', emoji:'✨', name:'ECHO-9', codename:'辅助型机甲',
    role:'SUPPORT · 辅助', roleZh:'战场支援', level:44, lvlpct:76,
    accent:0xf5b41a, accentCss:'#f5b41a', accentDark:'#d0930a',
    build:'support',
    stats:{'攻击力':50,'机动性':82,'防护':52,'能量':96},
    skills:[
      {ic:'💚', name:'纳米治疗', desc:'释放治疗无人机，持续为友军恢复护甲值。'},
      {ic:'⚡', name:'能量增幅', desc:'为指定队友注入能量，短时间提升其技能冷却速度。'},
      {ic:'🌟', name:'守护矩阵', desc:'终极技：为全体队友套上护盾并解除负面状态。'}
    ]
  }
];

/* =========================================================
   THREE.JS SETUP
   ========================================================= */
const mount = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
mount.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 1.2, 9);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.enablePan = false;
controls.minDistance = 6; controls.maxDistance = 13;
controls.minPolarAngle = Math.PI*0.18; controls.maxPolarAngle = Math.PI*0.82;
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
controls.target.set(0,0.6,0);

scene.add(new THREE.AmbientLight(0xffffff, .62));
const hemi = new THREE.HemisphereLight(0xffffff, 0xdad2c0, .7); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(5,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, .6); rim.position.set(-6,3,-6); scene.add(rim);
let accentLight = new THREE.PointLight(0xff7a29, .8, 30); accentLight.position.set(0,3,4); scene.add(accentLight);

// soft ground disc
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4.2, 64),
  new THREE.MeshStandardMaterial({color:0xffffff, roughness:.9, transparent:true, opacity:.35})
);
ground.rotation.x = -Math.PI/2; ground.position.y = -1.6; scene.add(ground);
const ringGlow = new THREE.Mesh(
  new THREE.RingGeometry(2.6, 3.4, 64),
  new THREE.MeshBasicMaterial({color:0xff7a29, transparent:true, opacity:.25, side:THREE.DoubleSide})
);
ringGlow.rotation.x = -Math.PI/2; ringGlow.position.y = -1.58; scene.add(ringGlow);

const rootGroup = new THREE.Group(); scene.add(rootGroup);

/* ---------- material helpers ---------- */
function bodyMat(){ return new THREE.MeshStandardMaterial({color:0xf3f1ea, roughness:.45, metalness:.35}); }
function darkMat(){ return new THREE.MeshStandardMaterial({color:0x3a3f47, roughness:.5, metalness:.6}); }
function accentMat(hex){ return new THREE.MeshStandardMaterial({color:hex, roughness:.35, metalness:.4, emissive:hex, emissiveIntensity:.35}); }
function glowMat(hex){ return new THREE.MeshStandardMaterial({color:hex, emissive:hex, emissiveIntensity:.9, roughness:.3}); }

// store accent-driven materials per model so skin change recolors them
function box(w,h,d,mat,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);return m;}
function cyl(rt,rb,h,mat,x=0,y=0,z=0,seg=20){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);return m;}
function sph(r,mat,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.SphereGeometry(r,28,24),mat);m.position.set(x,y,z);return m;}

/* =========================================================
   ROBOT BUILDERS — each returns {group, accentMats, parts}
   ========================================================= */
function buildRobot(hero){
  const g = new THREE.Group();
  const aMats = [];              // materials that follow skin color
  const acc = ()=>{const m=accentMat(hero.accent); aMats.push(m); return m;};
  const glow = ()=>{const m=glowMat(hero.accent); aMats.push(m); return m;};
  const B = bodyMat, D = darkMat;

  const anim = {};               // animation handles

  if(hero.build==='attack'){
    // sleek aggressive humanoid
    // torso
    const torso = box(1.5,1.7,0.95, B()); torso.position.y=0.9; g.add(torso);
    g.add(box(1.62,0.4,1.02, acc(), 0,1.55,0));           // chest accent
    g.add(box(0.9,0.5,1.0, D(), 0,0.2,0));                 // waist
    // head — angular visor
    const head = box(0.7,0.6,0.7, B(), 0,2.05,0); g.add(head);
    g.add(box(0.74,0.16,0.4, glow(), 0,2.08,0.28));        // visor
    g.add(box(0.12,0.55,0.12, acc(), 0.28,2.4,-0.1));      // antenna
    // shoulders (spiky/aggressive)
    [-1,1].forEach(s=>{
      g.add(box(0.55,0.55,0.9, D(), s*1.0,1.35,0));
      g.add(box(0.2,0.7,0.2, acc(), s*1.25,1.7,0));        // shoulder spike
      // arm
      g.add(cyl(0.2,0.2,0.9, B(), s*1.0,0.7,0));
      const fore = box(0.34,0.9,0.34, D(), s*1.0,-0.05,0); g.add(fore);
      // one arm = cannon
      if(s===1){ g.add(cyl(0.28,0.34,1.0, D(), 1.0,-0.15,0.1)); g.add(cyl(0.16,0.16,0.4, glow(), 1.0,-0.7,0.1)); }
    });
    // legs
    [-1,1].forEach(s=>{
      g.add(box(0.45,0.9,0.5, B(), s*0.4,-0.4,0));
      g.add(box(0.4,0.85,0.45, D(), s*0.4,-1.25,0.05));
      g.add(box(0.5,0.22,0.8, acc(), s*0.4,-1.55,0.1));    // foot
    });
    anim.pose = (g)=>{ g.children.forEach(c=>{}); };
    g.userData.idle = 'strike';
  }

  else if(hero.build==='defense'){
    // bulky heavy tank-mech
    const torso = box(2.1,1.8,1.5, B()); torso.position.y=0.95; g.add(torso);
    g.add(box(2.25,0.5,1.6, acc(), 0,1.55,0));             // heavy chest plate
    g.add(box(1.4,0.6,0.3, glow(), 0,1.0,0.78));           // core light
    // head — small, protected
    g.add(box(0.7,0.5,0.7, D(), 0,2.05,0));
    g.add(box(0.55,0.13,0.35, glow(), 0,2.08,0.3));
    // giant shoulder pauldrons
    [-1,1].forEach(s=>{
      const p = box(0.95,1.0,1.5, B(), s*1.55,1.3,0); g.add(p);
      g.add(box(1.0,0.28,1.55, acc(), s*1.55,1.75,0));
      // thick arms
      g.add(box(0.6,1.4,0.7, D(), s*1.5,0.2,0));
      // shield on left arm
      if(s===-1){ const sh=box(0.25,1.9,1.6, B(), -1.95,0.3,0.2); g.add(sh); g.add(box(0.12,1.5,1.2, acc(), -2.05,0.3,0.2)); }
      else { g.add(box(0.7,0.5,0.9, D(), 1.5,-0.55,0)); }  // fist
    });
    // stubby powerful legs
    [-1,1].forEach(s=>{
      g.add(box(0.75,0.9,0.9, B(), s*0.6,-0.4,0));
      g.add(box(0.8,0.7,1.0, D(), s*0.6,-1.2,0.05));
      g.add(box(0.9,0.25,1.2, acc(), s*0.6,-1.5,0.15));
    });
    g.userData.idle = 'guard';
  }

  else { // support — slender, floaty, with orbiting drones
    const torso = box(1.15,1.4,0.8, B()); torso.position.y=1.0; g.add(torso);
    g.add(box(1.22,0.35,0.85, acc(), 0,1.55,0));
    g.add(sph(0.28, glow(), 0,1.0,0.42));                  // core orb
    // rounded head with big single optic
    const head = sph(0.42, B(), 0,2.1,0); g.add(head);
    g.add(sph(0.2, glow(), 0,2.1,0.32));                   // eye
    g.add(box(0.1,0.5,0.1, acc(), 0.0,2.55,0));            // top antenna
    // slim arms
    [-1,1].forEach(s=>{
      g.add(cyl(0.13,0.13,1.0, D(), s*0.75,0.7,0));
      g.add(sph(0.18, acc(), s*0.75,0.15,0));
    });
    // hover base instead of legs (twin thrusters)
    g.add(box(0.9,0.5,0.6, D(), 0,-0.1,0));
    [-1,1].forEach(s=>{ g.add(cyl(0.28,0.36,0.5, B(), s*0.45,-0.55,0)); g.add(cyl(0.22,0.28,0.2, glow(), s*0.45,-0.85,0)); });
    // orbiting healing drones
    const drones = new THREE.Group();
    for(let i=0;i<3;i++){
      const dr = new THREE.Group();
      const orb = sph(0.16, glow()); dr.add(orb);
      dr.add(box(0.34,0.05,0.12, acc(), 0,0,0));
      dr.userData.a = i/3*Math.PI*2;
      drones.add(dr);
    }
    drones.position.y = 1.0; g.add(drones);
    g.userData.drones = drones;
    g.userData.idle = 'support';
  }

  g.scale.setScalar(1.15);
  return {group:g, accentMats:aMats};
}

/* =========================================================
   STATE & RENDERING
   ========================================================= */
let currentIdx = 0;
let currentSkin = null;         // override color, else hero.accent
let built = {};                 // id -> {group, accentMats}
let clock = 0;

function currentHero(){ return HEROES[currentIdx]; }
function activeColor(){ return currentSkin!==null ? SKINS[currentSkin].primary : currentHero().accent; }
function activeColorCss(){ return currentSkin!==null ? SKINS[currentSkin].css : currentHero().accentCss; }
function activeColorDark(){ return currentSkin!==null ? SKINS[currentSkin].dark : currentHero().accentDark; }

function mountHero(idx, animate=true){
  // remove old
  while(rootGroup.children.length) rootGroup.remove(rootGroup.children[0]);
  const hero = HEROES[idx];
  if(!built[hero.id]) built[hero.id] = buildRobot(hero);
  const b = built[hero.id];
  rootGroup.add(b.group);
  applySkinColor();
  if(animate){
    b.group.scale.setScalar(0.01);
    b.group.userData.spawnT = 0;
  }
}

function applySkinColor(){
  const hero = currentHero();
  const col = new THREE.Color(activeColor());
  const b = built[hero.id];
  if(b) b.accentMats.forEach(m=>{ m.color.copy(col); if(m.emissive) m.emissive.copy(col); });
  accentLight.color.copy(col);
  ringGlow.material.color.copy(col);
}

/* =========================================================
   UI RENDER (component-ish render functions)
   ========================================================= */
const dossier = document.getElementById('dossier');
const roster  = document.getElementById('roster');
const swatchesEl = document.getElementById('swatches');
const sysName = document.getElementById('sysName');

function renderTheme(){
  const c = activeColorCss(), d = activeColorDark();
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--accent-2', d);
  document.documentElement.style.setProperty('--hc', c);
}

function renderDossier(){
  const h = currentHero();
  sysName.textContent = h.name;
  const statsHtml = Object.entries(h.stats).map(([k,v])=>`
    <div class="stat">
      <div class="row"><span>${k}</span><span>${v}</span></div>
      <div class="bar"><i data-w="${v}"></i></div>
    </div>`).join('');
  const skillsHtml = h.skills.map(s=>`
    <div class="skill">
      <div class="ic">${s.ic}</div>
      <div class="tx"><b>${s.name}</b><small>${s.desc}</small></div>
    </div>`).join('');
  dossier.innerHTML = `
    <span class="role-tag">◆ ${h.role}</span>
    <div class="hero-name">${h.name}</div>
    <div class="hero-sub">${h.codename} · ${h.roleZh}</div>
    <div class="lvl">
      <div class="ring" style="--lvlpct:${h.lvlpct}%"><b>${h.level}</b></div>
      <div><small>PILOT LEVEL</small><div class="lvltxt">等级 ${h.level} · 精英</div></div>
    </div>
    ${statsHtml}
    <div class="skills"><h4>SKILLS · 技能</h4>${skillsHtml}</div>
  `;
  // animate bars
  requestAnimationFrame(()=>dossier.querySelectorAll('.bar i').forEach(el=>el.style.width=el.dataset.w+'%'));
}

function renderRoster(){
  roster.innerHTML = HEROES.map((h,i)=>`
    <div class="ava ${i===currentIdx?'active':''}" data-i="${i}" title="${h.name}">
      <div class="glow"></div>
      <div class="emo">${h.emoji}</div>
      <div class="nm">${h.role.split(' ')[0]}</div>
    </div>`).join('');
  roster.querySelectorAll('.ava').forEach(el=>{
    el.onclick=()=>selectHero(+el.dataset.i);
  });
}

function renderSwatches(){
  swatchesEl.innerHTML = SKINS.map((s,i)=>{
    const isDefault = s.primary===currentHero().accent && currentSkin===null;
    const active = (currentSkin===i) || (currentSkin===null && s.primary===currentHero().accent);
    return `<div class="sw ${active?'active':''}" data-i="${i}" style="background:${s.css}" title="${s.name}"></div>`;
  }).join('');
  swatchesEl.querySelectorAll('.sw').forEach(el=>{
    el.onclick=()=>{ currentSkin=+el.dataset.i; applySkinColor(); renderTheme(); renderSwatches(); };
  });
}

/* =========================================================
   ACTIONS
   ========================================================= */
function selectHero(idx){
  if(idx===currentIdx) return;
  currentIdx = idx;
  currentSkin = null;                 // reset to hero default skin
  mountHero(idx, true);
  renderTheme(); renderDossier(); renderRoster(); renderSwatches();
  // camera nudge
  tweenCam(9);
}

let camTween=null;
function tweenCam(dist){
  const start=camera.position.clone();
  const dir=start.clone().sub(controls.target).normalize();
  const end=controls.target.clone().add(dir.multiplyScalar(dist));
  end.y = 1.2;
  const t0=performance.now();
  camTween=()=>{const t=Math.min(1,(performance.now()-t0)/600);const e=1-Math.pow(1-t,3);
    camera.position.lerpVectors(start,end,e); if(t>=1)camTween=null;};
}

/* modal */
const modalWrap=document.getElementById('modalWrap');
document.getElementById('deployBtn').onclick=()=>{
  const h=currentHero();
  document.getElementById('mEmo').textContent=h.emoji;
  document.getElementById('mName').textContent=h.name;
  document.getElementById('mRole').textContent=`${h.codename} · ${h.roleZh}`;
  const skinName = currentSkin!==null?SKINS[currentSkin].name:'默认涂装';
  document.getElementById('mMsg').textContent=`涂装：${skinName} ｜ 等级 ${h.level}　确认部署该单位至前线？`;
  modalWrap.classList.add('on');
};
document.getElementById('mCancel').onclick=()=>modalWrap.classList.remove('on');
modalWrap.onclick=e=>{ if(e.target===modalWrap) modalWrap.classList.remove('on'); };
document.getElementById('mGo').onclick=()=>{
  modalWrap.classList.remove('on');
  const btn=document.getElementById('deployBtn');
  btn.textContent='DEPLOYED ✓';
  setTimeout(()=>btn.textContent='DEPLOY ▸',1800);
};

/* =========================================================
   RESIZE + LOOP
   ========================================================= */
function resize(){
  const w=mount.clientWidth,h=mount.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(mount); resize();

(function loop(){
  requestAnimationFrame(loop);
  clock += 0.016;
  if(camTween) camTween();

  const b = built[currentHero().id];
  if(b){
    const g=b.group;
    // spawn scale-in
    if(g.userData.spawnT!==undefined){
      g.userData.spawnT=Math.min(1,g.userData.spawnT+0.06);
      const e=1-Math.pow(1-g.userData.spawnT,3);
      g.scale.setScalar(0.2+e*0.95);
      if(g.userData.spawnT>=1) delete g.userData.spawnT;
    }
    // idle bob
    g.position.y = Math.sin(clock*1.4)*0.06;
    // support drones orbit
    if(g.userData.drones){
      g.userData.drones.children.forEach((d,i)=>{
        const a=d.userData.a + clock*0.9;
        d.position.set(Math.cos(a)*1.5, Math.sin(clock*1.5+i)*0.3, Math.sin(a)*1.5);
        d.rotation.y = -a;
      });
    }
  }
  controls.update();
  renderer.render(scene,camera);
})();

/* =========================================================
   INIT
   ========================================================= */
mountHero(0,true);
renderTheme(); renderDossier(); renderRoster(); renderSwatches();
</script>
</body>
</html>
