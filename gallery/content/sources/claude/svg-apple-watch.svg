<?xml version="1.0" encoding="UTF-8"?>
<svg width="620" height="820" viewBox="0 0 620 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景 -->
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#e3e8f0"/>
    </linearGradient>
    <!-- 表带（午夜蓝） -->
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4358"/>
      <stop offset="0.5" stop-color="#4a5570"/>
      <stop offset="1" stop-color="#333b4d"/>
    </linearGradient>
    <!-- 表壳（铝金属） -->
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4e57"/>
      <stop offset="0.5" stop-color="#2c2f36"/>
      <stop offset="1" stop-color="#1a1c21"/>
    </linearGradient>
    <!-- 表壳侧边高光 -->
    <linearGradient id="caseEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7079"/>
      <stop offset="0.5" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#26282d"/>
    </linearGradient>
    <!-- 屏幕表盘背景 -->
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#12203a"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <!-- 屏幕玻璃反光 -->
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 数码表冠 -->
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5f68"/>
      <stop offset="1" stop-color="#2c2f36"/>
    </linearGradient>
    <!-- 活动圆环 -->
    <linearGradient id="ringR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa1e5a"/>
      <stop offset="1" stop-color="#ff5e7e"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dff1e"/>
      <stop offset="1" stop-color="#5bd600"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00a8ff"/>
    </linearGradient>
    <filter id="wshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2a2f3a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="620" height="820" fill="url(#wbg)"/>
  <ellipse cx="310" cy="410" rx="230" ry="300" fill="#cdd6e6" opacity="0.4"/>

  <g filter="url(#wshadow)">
    <!-- 上表带 -->
    <path d="M 218 120 q 0 -60 46 -60 h 92 q 46 0 46 60 v 130 h -184 z" fill="url(#band)"/>
    <!-- 表带缝线 -->
    <path d="M 240 90 v 150 M 380 90 v 150" stroke="#2a3142" stroke-width="2" stroke-dasharray="4 5" opacity="0.6"/>

    <!-- 下表带 -->
    <path d="M 218 700 v -130 h 184 v 130 q 0 60 -46 60 h -92 q -46 0 -46 -60 z" fill="url(#band)"/>
    <path d="M 240 580 v 150 M 380 580 v 150" stroke="#2a3142" stroke-width="2" stroke-dasharray="4 5" opacity="0.6"/>
    <!-- 下表带孔 -->
    <ellipse cx="310" cy="700" rx="5" ry="8" fill="#22283a"/>
    <ellipse cx="310" cy="735" rx="5" ry="8" fill="#22283a"/>

    <!-- 表壳侧边 -->
    <rect x="188" y="215" width="244" height="330" rx="66" fill="url(#caseEdge)"/>
    <!-- 表壳正面 -->
    <rect x="196" y="222" width="228" height="316" rx="60" fill="url(#case)"/>

    <!-- 数码表冠 -->
    <rect x="430" y="300" width="26" height="52" rx="9" fill="url(#crown)"/>
    <circle cx="443" cy="326" r="10" fill="#3a3d44"/>
    <!-- 侧边按钮 -->
    <rect x="432" y="380" width="18" height="70" rx="8" fill="url(#crown)"/>

    <!-- 屏幕表盘 -->
    <rect x="216" y="242" width="188" height="276" rx="48" fill="url(#face)"/>

    <!-- 活动三环 -->
    <g transform="translate(288 340)" stroke-linecap="round" fill="none">
      <!-- 底环 -->
      <circle r="52" stroke="#3a1420" stroke-width="14"/>
      <circle r="37" stroke="#1a3a10" stroke-width="14"/>
      <circle r="22" stroke="#0a2f3a" stroke-width="14"/>
      <!-- 进度环（从顶部起，顺时针） -->
      <circle r="52" stroke="url(#ringR)" stroke-width="14"
              stroke-dasharray="270 327" transform="rotate(-90)"/>
      <circle r="37" stroke="url(#ringG)" stroke-width="14"
              stroke-dasharray="180 232" transform="rotate(-90)"/>
      <circle r="22" stroke="url(#ringB)" stroke-width="14"
              stroke-dasharray="115 138" transform="rotate(-90)"/>
    </g>

    <!-- 时间显示 -->
    <text x="310" y="448" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">10:09</text>
    <!-- 日期 -->
    <text x="310" y="478" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ff9d3c" text-anchor="middle" letter-spacing="1">MON 28</text>

    <!-- 屏幕玻璃反光 -->
    <rect x="216" y="242" width="188" height="276" rx="48" fill="url(#glare)"/>
  </g>

  <!-- 标题 -->
  <text x="310" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="bold" fill="#3a4358" text-anchor="middle" letter-spacing="5" opacity="0.85">APPLE WATCH</text>
</svg>
