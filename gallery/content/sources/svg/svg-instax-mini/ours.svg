<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
  <title id="title">Light blue Instax Mini 12 instant camera</title>
  <desc id="desc">Editable vector illustration of a light blue instant camera with flash, viewfinder, sensors, shutter button and lens.</desc>

  <defs>
    <linearGradient id="body" x1="0.14" y1="0.03" x2="0.86" y2="0.96">
      <stop offset="0" stop-color="#e7f5ff"/>
      <stop offset=".22" stop-color="#cde7f8"/>
      <stop offset=".63" stop-color="#bcdcf1"/>
      <stop offset="1" stop-color="#8fb8d3"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#f3fbff" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#b5d7eb" stop-opacity=".15"/>
      <stop offset="1" stop-color="#6089a5" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1=".5" x2="1" y2=".5">
      <stop offset="0" stop-color="#a7cde4"/>
      <stop offset=".18" stop-color="#d4ebf8"/>
      <stop offset=".82" stop-color="#c4e1f3"/>
      <stop offset="1" stop-color="#a9cee4"/>
    </linearGradient>
    <radialGradient id="mount" cx=".42" cy=".34" r=".72">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".48" stop-color="#d5eafb"/>
      <stop offset=".8" stop-color="#b3d2e7"/>
      <stop offset="1" stop-color="#86abc3"/>
    </radialGradient>
    <radialGradient id="lensRing" cx=".43" cy=".35" r=".75">
      <stop offset="0" stop-color="#f3fbff"/>
      <stop offset=".58" stop-color="#cbe2f2"/>
      <stop offset="1" stop-color="#9fc2d9"/>
    </radialGradient>
    <radialGradient id="glass" cx=".38" cy=".31" r=".72">
      <stop offset="0" stop-color="#536273"/>
      <stop offset=".15" stop-color="#1d2630"/>
      <stop offset=".4" stop-color="#0b0d12"/>
      <stop offset=".72" stop-color="#151922"/>
      <stop offset="1" stop-color="#020307"/>
    </radialGradient>
    <radialGradient id="glassCore" cx=".34" cy=".28" r=".68">
      <stop offset="0" stop-color="#6f8398"/>
      <stop offset=".16" stop-color="#202a35"/>
      <stop offset=".48" stop-color="#090b10"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="flashFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#cbd1cd"/>
      <stop offset="1" stop-color="#898c88"/>
    </linearGradient>
    <linearGradient id="flashGlass" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fcfff8"/>
      <stop offset=".22" stop-color="#dfe5dc"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".78" stop-color="#c8cec6"/>
      <stop offset="1" stop-color="#f9fff7"/>
    </linearGradient>
    <linearGradient id="viewBevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff2ff"/>
      <stop offset=".45" stop-color="#8bb4ce"/>
      <stop offset="1" stop-color="#e7f6ff"/>
    </linearGradient>
    <linearGradient id="whiteWindow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".4" stop-color="#ecece7"/>
      <stop offset="1" stop-color="#b9c1c5"/>
    </linearGradient>
    <filter id="bodyShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#31566f" flood-opacity=".34"/>
    </filter>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#41677f" flood-opacity=".35"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feComposite in="offset" in2="SourceAlpha" operator="out" result="cut"/>
      <feColorMatrix in="cut" values="0 0 0 0 0.14  0 0 0 0 0.29  0 0 0 0 0.4  0 0 0 .5 0"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M116 16C72 24 39 67 31 117c-8 51-10 493 0 565 7 53 41 83 92 87 105 8 369 7 486 0 51-3 79-34 84-83 7-74 6-504 0-570-5-55-39-93-91-99-108-11-386-12-486-1Z"/>
    </clipPath>
    <path id="upperTextPath" d="M327 467 A122 122 0 0 1 548 430"/>
    <path id="lowerTextPath" d="M340 536 A126 126 0 0 0 551 539"/>
  </defs>

  <!-- camera body -->
  <g filter="url(#bodyShadow)">
    <path d="M116 16C72 24 39 67 31 117c-8 51-10 493 0 565 7 53 41 83 92 87 105 8 369 7 486 0 51-3 79-34 84-83 7-74 6-504 0-570-5-55-39-93-91-99-108-11-386-12-486-1Z" fill="url(#body)" stroke="#9fc4dc" stroke-width="3"/>
    <path d="M117 28C79 35 49 74 43 120c-7 53-8 486 1 557 5 41 31 67 72 75" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
    <path d="M116 16C72 24 39 67 31 117c-8 51-10 493 0 565 7 53 41 83 92 87 105 8 369 7 486 0 51-3 79-34 84-83" fill="none" stroke="url(#bodyEdge)" stroke-width="12" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- subtle body lighting -->
  <g clip-path="url(#bodyClip)">
    <ellipse cx="356" cy="78" rx="285" ry="96" fill="#fff" opacity=".15"/>
    <ellipse cx="612" cy="501" rx="105" ry="290" fill="#82aecb" opacity=".11"/>
    <path d="M33 649C177 687 507 675 693 638v100H34Z" fill="#4f7895" opacity=".07"/>
  </g>

  <!-- left grip panel -->
  <path d="M38 306c37-2 83-2 137 1 15 1 24 12 24 26v414c-23 5-52 8-83 4-44-5-70-32-76-77-7-56-6-256-2-368Z" fill="url(#grip)" opacity=".72"/>
  <path d="M188 324v404" stroke="#eaf8ff" stroke-opacity=".36" stroke-width="3"/>

  <!-- viewfinder -->
  <g transform="translate(70 105)" filter="url(#softShadow)">
    <path d="M5 14 78 0l27 22-11 91-18 25-71-5-22-36Z" fill="url(#viewBevel)" opacity=".75"/>
    <path d="M26 28h53v70H26Z" fill="#25313d" stroke="#87a7ba" stroke-width="3"/>
    <path d="M32 34h41v58H32Z" fill="#080b10"/>
    <path d="M39 40h27v45H39Z" fill="#1d2630"/>
    <rect x="47" y="52" width="12" height="20" rx="4" fill="#9aabb4"/>
    <rect x="50" y="55" width="7" height="12" rx="2" fill="#f2f7f5"/>
  </g>

  <!-- flash -->
  <g transform="translate(213 25)" filter="url(#softShadow)">
    <rect x="0" y="0" width="96" height="207" rx="46" fill="url(#flashFrame)" stroke="#9da5a4" stroke-width="2"/>
    <rect x="10" y="12" width="76" height="179" rx="34" fill="url(#flashGlass)" stroke="#eaf0ea" stroke-width="2"/>
    <g fill="none" stroke="#8f9691" stroke-opacity=".5" stroke-width="2">
      <path d="M19 29h58M16 43h64M14 58h68M13 74h70M12 90h72M12 106h72M13 122h70M15 138h66M18 154h60M23 170h50"/>
      <path d="M25 20v158M37 15v171M49 13v175M61 16v169M73 24v153"/>
    </g>
    <path d="M25 26c15-14 46-12 58 4M17 174c17 15 48 16 67-1" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="4"/>
    <rect x="42" y="26" width="12" height="151" rx="6" fill="#fff" opacity=".36"/>
  </g>

  <!-- sensors -->
  <g>
    <circle cx="405" cy="119" r="19" fill="#6889a0" opacity=".32"/>
    <circle cx="405" cy="118" r="16" fill="#05070a" stroke="#233441" stroke-width="3"/>
    <circle cx="400" cy="112" r="5" fill="#91a8ba" opacity=".38"/>
    <circle cx="405" cy="162" r="19" fill="#6889a0" opacity=".32"/>
    <circle cx="405" cy="160" r="16" fill="#030509" stroke="#233441" stroke-width="3"/>
    <circle cx="400" cy="154" r="5" fill="#b5c8d6" opacity=".5"/>
    <circle cx="408" cy="164" r="3" fill="#394956"/>
  </g>

  <!-- logo -->
  <g fill="#74bcec" opacity=".92" font-family="Arial Rounded MT Bold, Trebuchet MS, Arial, sans-serif">
    <text x="517" y="123" font-size="33" font-weight="700" letter-spacing="-2">instax</text>
    <text x="519" y="137" font-size="22" font-weight="700" transform="rotate(90 519 137)">mini</text>
    <text x="548" y="184" font-size="67" font-weight="300" letter-spacing="-5">12</text>
  </g>

  <!-- shutter button -->
  <g filter="url(#softShadow)">
    <circle cx="126" cy="315" r="48" fill="#8cafc4" opacity=".8"/>
    <circle cx="126" cy="311" r="44" fill="url(#lensRing)" stroke="#dff4ff" stroke-width="4"/>
    <circle cx="126" cy="311" r="31" fill="#cae5f5" stroke="#a8cce3" stroke-width="2"/>
    <ellipse cx="116" cy="300" rx="17" ry="13" fill="#fff" opacity=".18"/>
  </g>

  <!-- lens mount -->
  <g filter="url(#softShadow)">
    <circle cx="449" cy="466" r="227" fill="url(#mount)"/>
    <circle cx="449" cy="466" r="182" fill="#c7e0f0" stroke="#344d5d" stroke-width="3"/>
    <circle cx="449" cy="466" r="173" fill="url(#lensRing)" stroke="#eaf8ff" stroke-width="5"/>
    <circle cx="449" cy="466" r="154" fill="#d5eafa" stroke="#637e90" stroke-width="2"/>
    <circle cx="449" cy="466" r="145" fill="none" stroke="#effaff" stroke-width="4" opacity=".65"/>
  </g>

  <!-- lens lettering: individual glyphs follow the circular rim cleanly -->
  <g fill="#7f9fb6" opacity=".62" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g aria-label="INSTAX LENS 60mm">
      <text x="449" y="337" transform="rotate(-53 449 466)">I</text>
      <text x="449" y="337" transform="rotate(-46 449 466)">N</text>
      <text x="449" y="337" transform="rotate(-39 449 466)">S</text>
      <text x="449" y="337" transform="rotate(-32 449 466)">T</text>
      <text x="449" y="337" transform="rotate(-25 449 466)">A</text>
      <text x="449" y="337" transform="rotate(-18 449 466)">X</text>
      <text x="449" y="337" transform="rotate(-5 449 466)">L</text>
      <text x="449" y="337" transform="rotate(2 449 466)">E</text>
      <text x="449" y="337" transform="rotate(9 449 466)">N</text>
      <text x="449" y="337" transform="rotate(16 449 466)">S</text>
      <text x="449" y="337" transform="rotate(29 449 466)">6</text>
      <text x="449" y="337" transform="rotate(36 449 466)">0</text>
      <text x="449" y="337" transform="rotate(43 449 466)">m</text>
      <text x="449" y="337" transform="rotate(51 449 466)">m</text>
    </g>
    <g aria-label="FOCUS RANGE 0.3m–infinity">
      <text x="449" y="596" transform="rotate(61 449 466)">F</text>
      <text x="449" y="596" transform="rotate(53.5 449 466)">O</text>
      <text x="449" y="596" transform="rotate(46 449 466)">C</text>
      <text x="449" y="596" transform="rotate(38.5 449 466)">U</text>
      <text x="449" y="596" transform="rotate(31 449 466)">S</text>
      <text x="449" y="596" transform="rotate(17 449 466)">R</text>
      <text x="449" y="596" transform="rotate(9.5 449 466)">A</text>
      <text x="449" y="596" transform="rotate(2 449 466)">N</text>
      <text x="449" y="596" transform="rotate(-5.5 449 466)">G</text>
      <text x="449" y="596" transform="rotate(-13 449 466)">E</text>
      <text x="449" y="596" transform="rotate(-27 449 466)">0</text>
      <text x="449" y="596" transform="rotate(-34.5 449 466)">.</text>
      <text x="449" y="596" transform="rotate(-42 449 466)">3</text>
      <text x="449" y="596" transform="rotate(-49.5 449 466)">m</text>
      <text x="449" y="596" transform="rotate(-57 449 466)">–</text>
      <text x="449" y="596" transform="rotate(-64.5 449 466)">∞</text>
    </g>
  </g>

  <!-- exposure window -->
  <g filter="url(#innerShadow)">
    <rect x="303" y="433" width="56" height="68" rx="13" fill="url(#whiteWindow)" stroke="#9eb6c4" stroke-width="3"/>
    <path d="M310 443c10-8 30-9 40-1" fill="none" stroke="#fff" stroke-width="4" opacity=".85"/>
  </g>

  <!-- lens -->
  <g>
    <circle cx="449" cy="466" r="79" fill="#10141b" stroke="#b7d2e4" stroke-width="4"/>
    <circle cx="449" cy="466" r="69" fill="url(#glass)" stroke="#05070a" stroke-width="5"/>
    <circle cx="449" cy="466" r="54" fill="none" stroke="#36414d" stroke-width="5" opacity=".68"/>
    <circle cx="449" cy="466" r="42" fill="url(#glassCore)" stroke="#121822" stroke-width="4"/>
    <circle cx="449" cy="466" r="22" fill="#080b11"/>
    <ellipse cx="438" cy="450" rx="13" ry="20" fill="#a3bbce" opacity=".18" transform="rotate(-28 438 450)"/>
    <path d="M407 432a56 56 0 0 1 69-12" fill="none" stroke="#8094a7" stroke-width="4" opacity=".2" stroke-linecap="round"/>
  </g>

  <!-- base feet -->
  <g fill="#8cb3cd" stroke="#a9cee3" stroke-width="2">
    <ellipse cx="270" cy="769" rx="13" ry="6"/>
    <ellipse cx="580" cy="767" rx="13" ry="6"/>
  </g>
</svg>
