<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">展开的素雅折扇</title>
  <desc id="desc">一把展开的米白色折扇，带有逐根可见的深木色扇骨和中央扇轴铆钉。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e5"/>
      <stop offset="0.62" stop-color="#eee5d4"/>
      <stop offset="1" stop-color="#e4d6be"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4b36"/>
      <stop offset="0.48" stop-color="#a27a57"/>
      <stop offset="1" stop-color="#5a3d2c"/>
    </linearGradient>
    <radialGradient id="rivet" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f2d9a7"/>
      <stop offset="0.45" stop-color="#bd8b45"/>
      <stop offset="1" stop-color="#6e4624"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#3d2c20" flood-opacity="0.18"/>
    </filter>
    <filter id="paperTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <clipPath id="fanClip">
      <path d="M39.8 529.9 A580 580 0 0 1 1160.2 529.9 L764.2 636 A170 170 0 0 0 435.8 636 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- 扇骨：由同一根骨架绕扇轴均匀展开 -->
    <g stroke="url(#wood)" stroke-linecap="round">
      <line x1="600" y1="680" x2="600" y2="116" stroke-width="8" transform="rotate(-75 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="108" stroke-width="5" transform="rotate(-65.625 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="103" stroke-width="5" transform="rotate(-56.25 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="100" stroke-width="5" transform="rotate(-46.875 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="98" stroke-width="5" transform="rotate(-37.5 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="98" stroke-width="5" transform="rotate(-28.125 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="98" stroke-width="5" transform="rotate(-18.75 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="99" stroke-width="5" transform="rotate(-9.375 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="100" stroke-width="5"/>
      <line x1="600" y1="680" x2="600" y2="99" stroke-width="5" transform="rotate(9.375 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="98" stroke-width="5" transform="rotate(18.75 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="98" stroke-width="5" transform="rotate(28.125 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="98" stroke-width="5" transform="rotate(37.5 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="100" stroke-width="5" transform="rotate(46.875 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="103" stroke-width="5" transform="rotate(56.25 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="108" stroke-width="5" transform="rotate(65.625 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="116" stroke-width="8" transform="rotate(75 600 680)"/>
    </g>

    <!-- 素雅扇面 -->
    <path d="M39.8 529.9 A580 580 0 0 1 1160.2 529.9 L764.2 636 A170 170 0 0 0 435.8 636 Z"
          fill="url(#paper)" stroke="#c9b89b" stroke-width="3" filter="url(#paperTexture)"/>

    <!-- 扇面上透出的扇骨与折痕 -->
    <g clip-path="url(#fanClip)" fill="none" stroke-linecap="round">
      <g stroke="#7d5b40" stroke-width="4.2" opacity="0.5">
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-75 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-65.625 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-56.25 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-46.875 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-37.5 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-28.125 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-18.75 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(-9.375 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(9.375 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(18.75 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(28.125 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(37.5 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(46.875 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(56.25 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(65.625 600 680)"/>
        <line x1="600" y1="685" x2="600" y2="92" transform="rotate(75 600 680)"/>
      </g>
      <g stroke="#fffdf6" stroke-width="1.5" opacity="0.62">
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(-70.3125 600 680)"/>
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(-51.5625 600 680)"/>
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(-32.8125 600 680)"/>
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(-14.0625 600 680)"/>
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(14.0625 600 680)"/>
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(32.8125 600 680)"/>
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(51.5625 600 680)"/>
        <line x1="600" y1="680" x2="600" y2="92" transform="rotate(70.3125 600 680)"/>
      </g>
    </g>

    <!-- 外侧大骨 -->
    <g fill="none" stroke="url(#wood)" stroke-linecap="round">
      <line x1="600" y1="680" x2="600" y2="113" stroke-width="11" transform="rotate(-75 600 680)"/>
      <line x1="600" y1="680" x2="600" y2="113" stroke-width="11" transform="rotate(75 600 680)"/>
    </g>

    <!-- 扇轴铆钉 -->
    <circle cx="600" cy="680" r="30" fill="#4a3022" opacity="0.28"/>
    <circle cx="600" cy="676" r="27" fill="url(#rivet)" stroke="#54351e" stroke-width="5"/>
    <circle cx="592" cy="668" r="7" fill="#fff2cf" opacity="0.68"/>
    <circle cx="600" cy="676" r="10" fill="none" stroke="#78502b" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
