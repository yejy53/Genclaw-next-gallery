<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Switch 2 inspired handheld console</title>
  <desc id="desc">An original SVG illustration of a next generation handheld game console with blue and red side controllers and a glowing display.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141d"/>
      <stop offset="0.52" stop-color="#171b25"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313844"/>
      <stop offset="0.5" stop-color="#151921"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1be7ff"/>
      <stop offset="0.25" stop-color="#2649ff"/>
      <stop offset="0.56" stop-color="#8218ff"/>
      <stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <linearGradient id="leftJoy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30e9ff"/>
      <stop offset="1" stop-color="#007cc7"/>
    </linearGradient>
    <linearGradient id="rightJoy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b75"/>
      <stop offset="1" stop-color="#cf1334"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="0.18" stop-color="#8ff6ff" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#7c48ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="326" y="178" width="548" height="342" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <ellipse cx="600" cy="592" rx="425" ry="54" fill="#000000" opacity="0.42"/>
  <circle cx="174" cy="126" r="220" fill="#20d8ff" opacity="0.06"/>
  <circle cx="1040" cy="575" r="260" fill="#ff2e55" opacity="0.07"/>

  <g filter="url(#softShadow)">
    <rect x="118" y="140" width="964" height="438" rx="78" fill="url(#body)"/>
    <rect x="132" y="154" width="936" height="410" rx="68" fill="none" stroke="#535b68" stroke-opacity="0.5" stroke-width="2"/>

    <path d="M196 140h130v438H196c-43 0-78-35-78-78V218c0-43 35-78 78-78Z" fill="url(#leftJoy)"/>
    <path d="M1004 140H874v438h130c43 0 78-35 78-78V218c0-43-35-78-78-78Z" fill="url(#rightJoy)"/>
    <path d="M326 140h548v438H326z" fill="#11151d"/>

    <rect x="326" y="178" width="548" height="342" rx="24" fill="#070a12" stroke="#3c4350" stroke-width="5"/>
    <g clip-path="url(#screenClip)">
      <rect x="326" y="178" width="548" height="342" fill="url(#screen)"/>
      <circle cx="564" cy="328" r="240" fill="url(#flare)"/>
      <path d="M326 500 476 336l88 84 126-154 184 224v30H326Z" fill="#050914" opacity="0.45"/>
      <path d="M326 211c96 34 190 50 282 47 91-4 178-27 266-69v-11H326Z" fill="#ffffff" opacity="0.13"/>
      <path d="M381 458c79-90 168-137 267-142 86-5 164 19 235 70v134H381Z" fill="#000000" opacity="0.18"/>
      <g fill="#ffffff" opacity="0.8">
        <circle cx="436" cy="245" r="3"/>
        <circle cx="493" cy="284" r="2"/>
        <circle cx="756" cy="236" r="3"/>
        <circle cx="823" cy="304" r="2"/>
        <circle cx="681" cy="410" r="2"/>
        <circle cx="531" cy="458" r="3"/>
      </g>
      <text x="600" y="367" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" text-anchor="middle" letter-spacing="5">SWITCH 2</text>
      <text x="600" y="405" fill="#d7fbff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="7">VECTOR CONCEPT</text>
    </g>

    <g transform="translate(0 2)">
      <circle cx="229" cy="246" r="43" fill="#121721" stroke="#8ff4ff" stroke-opacity="0.42" stroke-width="4"/>
      <circle cx="229" cy="246" r="21" fill="#27313d"/>
      <rect x="222" y="192" width="14" height="30" rx="7" fill="#c4fbff" opacity="0.68"/>
      <rect x="222" y="270" width="14" height="30" rx="7" fill="#c4fbff" opacity="0.68"/>
      <rect x="175" y="239" width="30" height="14" rx="7" fill="#c4fbff" opacity="0.68"/>
      <rect x="253" y="239" width="30" height="14" rx="7" fill="#c4fbff" opacity="0.68"/>

      <circle cx="233" cy="382" r="17" fill="#0e121a"/>
      <circle cx="187" cy="382" r="17" fill="#0e121a"/>
      <circle cx="233" cy="428" r="17" fill="#0e121a"/>
      <circle cx="187" cy="428" r="17" fill="#0e121a"/>
      <circle cx="233" cy="382" r="6" fill="#74eeff"/>
      <circle cx="187" cy="382" r="6" fill="#74eeff"/>
      <circle cx="233" cy="428" r="6" fill="#74eeff"/>
      <circle cx="187" cy="428" r="6" fill="#74eeff"/>
      <rect x="268" y="485" width="30" height="10" rx="5" fill="#0d121b" opacity="0.8"/>
    </g>

    <g transform="translate(0 2)">
      <circle cx="969" cy="421" r="43" fill="#121721" stroke="#ffbcc5" stroke-opacity="0.38" stroke-width="4"/>
      <circle cx="969" cy="421" r="21" fill="#27313d"/>
      <circle cx="969" cy="248" r="18" fill="#0e121a"/>
      <circle cx="1015" cy="248" r="18" fill="#0e121a"/>
      <circle cx="969" cy="294" r="18" fill="#0e121a"/>
      <circle cx="1015" cy="294" r="18" fill="#0e121a"/>
      <text x="969" y="254" fill="#ffd6dc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Y</text>
      <text x="1015" y="254" fill="#ffd6dc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" text-anchor="middle">X</text>
      <text x="969" y="300" fill="#ffd6dc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" text-anchor="middle">B</text>
      <text x="1015" y="300" fill="#ffd6dc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" text-anchor="middle">A</text>
      <rect x="901" y="485" width="30" height="10" rx="5" fill="#0d121b" opacity="0.8"/>
    </g>

    <g filter="url(#glow)">
      <rect x="354" y="548" width="492" height="5" rx="2.5" fill="#31efff" opacity="0.18"/>
      <rect x="434" y="548" width="158" height="5" rx="2.5" fill="#2ff0ff" opacity="0.6"/>
      <rect x="616" y="548" width="150" height="5" rx="2.5" fill="#ff4565" opacity="0.55"/>
    </g>

    <path d="M326 140v438" stroke="#000000" stroke-opacity="0.4" stroke-width="4"/>
    <path d="M874 140v438" stroke="#000000" stroke-opacity="0.4" stroke-width="4"/>
    <path d="M146 202c11-25 33-44 59-51h83" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="5" stroke-linecap="round"/>
    <path d="M914 151h83c28 7 50 27 60 53" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="600" y="650" fill="#c9d1dc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="8">HANDHELD CONSOLE SVG</text>
</svg>
