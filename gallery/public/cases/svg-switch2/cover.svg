    <path d="M1314 39c34 23 53 63 53 119v257c0 69-35 116-91 130" fill="none" stroke="url(#edgeHighlight)" stroke-width="3" opacity="0.28"/>
    <path d="M219 43h914" stroke="#5e6865" stroke-width="2" opacity="0.28"/>
    <path d="M224 538h904" stroke="#88928f" stroke-width="2" opacity="0.24"/>
