      <circle cx="0" cy="37" r="19" fill="url(#buttonTop)" stroke="#070808" stroke-width="3"/>
      <text x="0" y="-30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9fa7a2">X</text>
      <text x="-39" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9fa7a2">Y</text>
      <text x="39" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9fa7a2">A</text>
      <text x="0" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9fa7a2">B</text>
    </g>
    <g transform="translate(1226 278)">
