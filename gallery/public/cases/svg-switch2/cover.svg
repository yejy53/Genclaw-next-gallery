      <circle r="37" fill="#ff7152" opacity="0.95"/>
      <path d="M-35 0a35 35 0 0 1 65-18 36 36 0 0 0-61 30Z" fill="#ffb199" opacity="0.78"/>
      <circle r="32" fill="#1b201d"/>
      <circle r="27" fill="url(#stickTop)" stroke="#070908" stroke-width="3"/>
      <circle r="20" fill="none" stroke="#5b625c" stroke-opacity="0.45" stroke-width="2"/>
    </g>
    <g transform="translate(1188 379)">
      <circle r="18" fill="#202522" stroke="#0d100f" stroke-width="3"/>
      <path d="M-7 4v-8l7-6 7 6v8H3v-7h-6v7Z" fill="none" stroke="#6c746f" stroke-width="2" stroke-linejoin="round"/>
